<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Theme — DOM Homework</title>
  <style>
    .myHighlightClass { background: #fff3cd; transition: background 200ms; }
    .myDarkClass { background:#111; color:#eee; }
  </style>
</head>
<body>
  <header>
    <h1 id="myTitleId">My Themed Page</h1>
  </header>

  <main id="myMainId">
    <p class="myIntroClass">Welcome! This page will update with JavaScript.</p>
    <ul id="myListId"></ul>
    <img id="myImgId" src="https://via.placeholder.com/400x200" alt="[placeholder]" />
    <button id="myToggleBtnId">Toggle Highlight</button>
    <button id="mySwapBtnId">Swap Image</button>
  </main>

  <footer id="myFooterId">© 2025 Alek Berreth</footer>

  <script src="scripts.js"></script>
</body>
</html>
